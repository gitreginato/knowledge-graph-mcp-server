name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python test_kg_infra.py
      - run: python -c "import server; print('import ok')"
      - run: python -c "import cli; print('cli ok')"
